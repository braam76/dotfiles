# Vague palette: https://github.com/vague-theme/vague
set -g status-style 'bg=#252530,fg=#cdcdcd'
set -g message-style 'bg=#252530,fg=#d7d7d7'
set -g message-command-style 'bg=#252530,fg=#6e94b2'
set -g mode-style 'bg=#6e94b2,fg=#141415'
set -g pane-border-style 'fg=#252530'
set -g pane-active-border-style 'fg=#d7d7d7'
set -g display-panes-colour '#606079'
set -g display-panes-active-colour '#6e94b2'
set -g clock-mode-colour '#6e94b2'
set -g window-status-style 'bg=#252530,fg=#606079'
set -g window-status-current-style 'bg=#6e94b2,fg=#141415,bold'
set -g window-status-activity-style 'fg=#f3be7c,bold'
set -g window-status-bell-style 'fg=#d8647e,bold'
set -g status-left '#[fg=#7fa563,bold]#S #[default]'
set -g status-right '#[fg=#aeaed1]%H:%M #[fg=#606079]%Y-%m-%d'
