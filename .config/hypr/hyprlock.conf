# Vague palette: https://github.com/vague-theme/vague
$color = rgba(20,20,21,1.0)
$inner_color = rgba(20,20,21,1.0)
$outer_color = rgba(205,205,205,1.0)
$font_color = rgba(205,205,205,1.0)
$check_color = rgba(110,148,178,1.0)

background {
  monitor=
  blur_passes=3
  blur_size=8
  brightness=0.700000
  color=$color
  path=/home/braam/Pictures/wallpaper-nixos-big.png
}

general {
  hide_cursor=true
  ignore_empty_input=true
}

input-field {
  monitor=
  size=320, 56
  check_color=$check_color
  dots_center=true
  fade_on_empty=false
  fail_color=rgb(d8647e)
  fail_text=Incorrect password. Try again.
  font_color=$font_color
  halign=center
  inner_color=$inner_color
  outer_color=$outer_color
  outline_thickness=2
  placeholder_text=Password…
  position=0, -40
  rounding=10
  valign=center
}
