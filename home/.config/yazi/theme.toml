# Solarized Osaka palette; existing rules, icons and UI roles retained.
[completion]
active = { bg = "#002d38", fg = "#d33682" }
border = { fg = "#278bd3" }
inactive = { fg = "#839495" }

[filetype]
rules = [
  { mime = "image/*", fg = "#2aa298" },
  { mime = "video/*", fg = "#b38600" },
  { mime = "audio/*", fg = "#b38600" },
  { mime = "application/zip", fg = "#d33682" },
  { mime = "application/gzip", fg = "#d33682" },
  { mime = "application/tar", fg = "#d33682" },
  { mime = "application/bzip", fg = "#d33682" },
  { mime = "application/bzip2", fg = "#d33682" },
  { mime = "application/7z-compressed", fg = "#d33682" },
  { mime = "application/rar", fg = "#d33682" },
  { mime = "application/xz", fg = "#d33682" },
  { mime = "application/doc", fg = "#859900" },
  { mime = "application/pdf", fg = "#859900" },
  { mime = "application/rtf", fg = "#859900" },
  { mime = "application/vnd.*", fg = "#859900" },
  { url = "*/", fg = "#278bd3", bold = true },
  { mime = "*", fg = "#839495" },
]

[help]
desc = { fg = "#839495" }
footer = { fg = "#839495" }
hovered = { bg = "#002d38", fg = "#ede7d4" }
on = { fg = "#d33682" }
run = { fg = "#2aa298" }

[icon]
conds = [
  { if = "orphan", text = "", fg = "#839495" },
  { if = "link", text = "", fg = "#586e74" },
  { if = "block", text = "", fg = "#b38600" },
  { if = "char", text = "", fg = "#b38600" },
  { if = "fifo", text = "", fg = "#b38600" },
  { if = "sock", text = "", fg = "#b38600" },
  { if = "sticky", text = "", fg = "#b38600" },
  { if = "dummy", text = "", fg = "#dc312e" },
  { if = "dir", text = "", fg = "#278bd3" },
  { if = "exec", text = "", fg = "#859900" },
  { if = "!dir", text = "", fg = "#839495" },
]
dirs = [
  { name = ".config", text = "", fg = "#ca4c16" },
  { name = ".git", text = "", fg = "#2aa298" },
  { name = ".github", text = "", fg = "#278bd3" },
  { name = ".npm", text = "", fg = "#278bd3" },
  { name = "Desktop", text = "", fg = "#2aa298" },
  { name = "Development", text = "", fg = "#2aa298" },
  { name = "Documents", text = "", fg = "#2aa298" },
  { name = "Downloads", text = "", fg = "#2aa298" },
  { name = "Library", text = "", fg = "#2aa298" },
  { name = "Movies", text = "", fg = "#2aa298" },
  { name = "Music", text = "", fg = "#2aa298" },
  { name = "Pictures", text = "", fg = "#2aa298" },
  { name = "Public", text = "", fg = "#2aa298" },
  { name = "Videos", text = "", fg = "#2aa298" },
]

[indicator]
current = { bg = "#002d38", bold = true }
preview = { bg = "#002d38", bold = true }

[input]
border = { fg = "#278bd3" }
selected = { bg = "#002d38" }
title = { fg = "#839495" }
value = { fg = "#839495" }

[mgr]
syntect_theme = "~/.config/yazi/solarized-osaka.tmTheme"
border_style = { fg = "#586e74" }
count_copied = { bg = "#859900", fg = "#00141a" }
count_cut = { bg = "#dc312e", fg = "#00141a" }
count_selected = { bg = "#b38600", fg = "#00141a" }
cwd = { fg = "#2aa298" }
find_keyword = { fg = "#859900", bold = true }
find_position = { fg = "#d33682" }
marker_copied = { bg = "#859900", fg = "#859900" }
marker_cut = { bg = "#dc312e", fg = "#dc312e" }
marker_selected = { bg = "#b38600", fg = "#b38600" }

[mode]
normal_alt = { bg = "#00141a", fg = "#278bd3" }
normal_main = { bg = "#278bd3", fg = "#00141a", bold = true }
select_alt = { bg = "#00141a", fg = "#859900" }
select_main = { bg = "#859900", fg = "#00141a", bold = true }
unset_alt = { bg = "#00141a", fg = "#dc312e" }
unset_main = { bg = "#dc312e", fg = "#00141a", bold = true }

[pick]
active = { fg = "#d33682" }
border = { fg = "#278bd3" }
inactive = { fg = "#839495" }

[status]
perm_exec = { fg = "#859900" }
perm_read = { fg = "#b38600" }
perm_sep = { fg = "#2aa298" }
perm_type = { fg = "#278bd3" }
perm_write = { fg = "#dc312e" }
progress_error = { bg = "#00141a", fg = "#dc312e" }
progress_label = { bg = "#00141a", fg = "#839495" }
progress_normal = { bg = "#00141a", fg = "#839495" }

[tabs]
active = { bg = "#278bd3", fg = "#00141a", bold = true }
inactive = { bg = "#002d38", fg = "#278bd3" }

[tasks]
border = { fg = "#278bd3" }
hovered = { bg = "#002d38", fg = "#ede7d4" }
title = { fg = "#839495" }

[which]
cand = { fg = "#2aa298" }
desc = { fg = "#839495" }
mask = { bg = "#002d38" }
rest = { fg = "#dc312e" }
separator_style = { fg = "#586e74" }
