# Leader: Ctrl+Space. Press it twice to send Ctrl+Space to the application.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Number windows from 1 and use leader + 0 for window 10.
set -g base-index 1
set -g renumber-windows on
bind 0 select-window -t :10

# Preserve modified keys (for example, Shift+Enter).
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',alacritty:extkeys'

# Split in the current pane's working directory.
unbind '"'
unbind %
bind v split-window -h -c '#{pane_current_path}'
bind h split-window -v -c '#{pane_current_path}'

# Use leader + arrow keys to move between panes.
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

source-file ~/.config/tmux/vague.conf

# Reload the configuration, including the local theme.
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'
