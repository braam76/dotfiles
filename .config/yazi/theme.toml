# Vague palette; existing rules, icons and UI roles retained.
[completion]
active = { bg = "#252530", fg = "#bb9dbd" }
border = { fg = "#6e94b2" }
inactive = { fg = "#cdcdcd" }

[filetype]
rules = [
  { mime = "image/*", fg = "#aeaed1" },
  { mime = "video/*", fg = "#f3be7c" },
  { mime = "audio/*", fg = "#f3be7c" },
  { mime = "application/zip", fg = "#bb9dbd" },
  { mime = "application/gzip", fg = "#bb9dbd" },
  { mime = "application/tar", fg = "#bb9dbd" },
  { mime = "application/bzip", fg = "#bb9dbd" },
  { mime = "application/bzip2", fg = "#bb9dbd" },
  { mime = "application/7z-compressed", fg = "#bb9dbd" },
  { mime = "application/rar", fg = "#bb9dbd" },
  { mime = "application/xz", fg = "#bb9dbd" },
  { mime = "application/doc", fg = "#7fa563" },
  { mime = "application/pdf", fg = "#7fa563" },
  { mime = "application/rtf", fg = "#7fa563" },
  { mime = "application/vnd.*", fg = "#7fa563" },
  { url = "*/", fg = "#6e94b2", bold = true },
  { mime = "*", fg = "#cdcdcd" },
]

[help]
desc = { fg = "#cdcdcd" }
footer = { fg = "#cdcdcd" }
hovered = { bg = "#252530", fg = "#d7d7d7" }
on = { fg = "#bb9dbd" }
run = { fg = "#aeaed1" }

[icon]
conds = [
  { if = "orphan", text = "", fg = "#cdcdcd" },
  { if = "link", text = "", fg = "#606079" },
  { if = "block", text = "", fg = "#f3be7c" },
  { if = "char", text = "", fg = "#f3be7c" },
  { if = "fifo", text = "", fg = "#f3be7c" },
  { if = "sock", text = "", fg = "#f3be7c" },
  { if = "sticky", text = "", fg = "#f3be7c" },
  { if = "dummy", text = "", fg = "#d8647e" },
  { if = "dir", text = "", fg = "#6e94b2" },
  { if = "exec", text = "", fg = "#7fa563" },
  { if = "!dir", text = "", fg = "#cdcdcd" },
]
dirs = [
  { name = ".config", text = "", fg = "#e0a363" },
  { name = ".git", text = "", fg = "#aeaed1" },
  { name = ".github", text = "", fg = "#6e94b2" },
  { name = ".npm", text = "", fg = "#6e94b2" },
  { name = "Desktop", text = "", fg = "#aeaed1" },
  { name = "Development", text = "", fg = "#aeaed1" },
  { name = "Documents", text = "", fg = "#aeaed1" },
  { name = "Downloads", text = "", fg = "#aeaed1" },
  { name = "Library", text = "", fg = "#aeaed1" },
  { name = "Movies", text = "", fg = "#aeaed1" },
  { name = "Music", text = "", fg = "#aeaed1" },
  { name = "Pictures", text = "", fg = "#aeaed1" },
  { name = "Public", text = "", fg = "#aeaed1" },
  { name = "Videos", text = "", fg = "#aeaed1" },
]

[indicator]
current = { bg = "#252530", bold = true }
preview = { bg = "#252530", bold = true }

[input]
border = { fg = "#6e94b2" }
selected = { bg = "#252530" }
title = { fg = "#cdcdcd" }
value = { fg = "#cdcdcd" }

[mgr]
syntect_theme = "~/.config/yazi/vague.tmTheme"
border_style = { fg = "#606079" }
count_copied = { bg = "#7fa563", fg = "#141415" }
count_cut = { bg = "#d8647e", fg = "#141415" }
count_selected = { bg = "#f3be7c", fg = "#141415" }
cwd = { fg = "#aeaed1" }
find_keyword = { fg = "#7fa563", bold = true }
find_position = { fg = "#bb9dbd" }
marker_copied = { bg = "#7fa563", fg = "#7fa563" }
marker_cut = { bg = "#d8647e", fg = "#d8647e" }
marker_selected = { bg = "#f3be7c", fg = "#f3be7c" }

[mode]
normal_alt = { bg = "#141415", fg = "#6e94b2" }
normal_main = { bg = "#6e94b2", fg = "#141415", bold = true }
select_alt = { bg = "#141415", fg = "#7fa563" }
select_main = { bg = "#7fa563", fg = "#141415", bold = true }
unset_alt = { bg = "#141415", fg = "#d8647e" }
unset_main = { bg = "#d8647e", fg = "#141415", bold = true }

[pick]
active = { fg = "#bb9dbd" }
border = { fg = "#6e94b2" }
inactive = { fg = "#cdcdcd" }

[status]
perm_exec = { fg = "#7fa563" }
perm_read = { fg = "#f3be7c" }
perm_sep = { fg = "#aeaed1" }
perm_type = { fg = "#6e94b2" }
perm_write = { fg = "#d8647e" }
progress_error = { bg = "#141415", fg = "#d8647e" }
progress_label = { bg = "#141415", fg = "#cdcdcd" }
progress_normal = { bg = "#141415", fg = "#cdcdcd" }

[tabs]
active = { bg = "#6e94b2", fg = "#141415", bold = true }
inactive = { bg = "#252530", fg = "#6e94b2" }

[tasks]
border = { fg = "#6e94b2" }
hovered = { bg = "#252530", fg = "#d7d7d7" }
title = { fg = "#cdcdcd" }

[which]
cand = { fg = "#aeaed1" }
desc = { fg = "#cdcdcd" }
mask = { bg = "#252530" }
rest = { fg = "#d8647e" }
separator_style = { fg = "#606079" }
