# Solarized Osaka, adapted from the upstream terminal palette.
set -g status-style 'bg=#002d38,fg=#839495'
set -g message-style 'bg=#002d38,fg=#ede7d4'
set -g message-command-style 'bg=#002d38,fg=#278bd3'
set -g mode-style 'bg=#278bd3,fg=#00141a'
set -g pane-border-style 'fg=#002d38'
set -g pane-active-border-style 'fg=#ede7d4'
set -g display-panes-colour '#586e74'
set -g display-panes-active-colour '#278bd3'
set -g clock-mode-colour '#278bd3'
set -g window-status-style 'bg=#002d38,fg=#586e74'
set -g window-status-current-style 'bg=#278bd3,fg=#00141a,bold'
set -g window-status-activity-style 'fg=#b38600,bold'
set -g window-status-bell-style 'fg=#dc312e,bold'
set -g status-left '#[fg=#859900,bold]#S #[default]'
set -g status-right '#[fg=#2aa298]%H:%M #[fg=#586e74]%Y-%m-%d'
