# Keep Starship's default prompt layout, with Vague colors.
palette = "vague"

[palettes.vague]
black = "#141415"
white = "#d7d7d7"
bright-white = "#d7d7d7"
red = "#d8647e"
green = "#7fa563"
yellow = "#f3be7c"
blue = "#6e94b2"
purple = "#bb9dbd"
cyan = "#aeaed1"
bright-black = "#606079"
bright-red = "#e08398"
bright-green = "#99b782"
bright-yellow = "#f5cb96"
bright-blue = "#8ba9c1"
bright-purple = "#c9b1ca"
bright-cyan = "#bebeda"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "bold blue"
read_only_style = "red"

[git_branch]
style = "bold purple"

[git_status]
style = "bold red"

[cmd_duration]
style = "bold yellow"

[username]
style_user = "bold green"
style_root = "bold red"

[hostname]
style = "bold cyan"

[time]
style = "bold bright-black"
